[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frtb-market-risk-engine"
version = "0.1.0"
description = "Educational Basel FRTB Standardised and Internal Models Approach engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "PyYAML>=6.0,<7.0",
  "scipy>=1.13,<2.0",
  "matplotlib>=3.9,<4.0",
  "xlsxwriter>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29,<7.0",
  "nbconvert>=7.16,<8.0",
  "pytest>=8.0,<9.0",
  "nbformat>=5.10,<6.0",
  "nbclient>=0.10,<1.0",
]

[project.scripts]
frtb-engine = "frtb_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]
